{% extends "base.html" %}
{% block title %}{{ page.title|striptags|e }} | {{ SITENAME }}{% endblock %}
{% block canonical %}{{ page.url.lstrip('/') }}{% endblock %}
{% block content %}
<article class="document">
    <header class="page-heading">
        <h1>{{ page.title }}</h1>
    </header>
    <div class="prose">{{ page.content }}</div>
</article>
{% endblock %}
